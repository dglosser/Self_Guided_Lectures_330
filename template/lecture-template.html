<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ==== Index metadata: fill these in. build_index.py reads them. ==== -->
<!-- lecture-number: digits, optionally with a single letter suffix (7, 07, 7a). -->
<meta name="lecture-number" content="00">
<!-- lecture-title: what shows in the index. -->
<meta name="lecture-title" content="Untitled Lecture">
<!-- lecture-topic: optional one-line description under the link. Delete if unused. -->
<meta name="lecture-topic" content="One-line description of what this covers">
<!-- ================================================================== -->

<title>Untitled Lecture</title>
<style>
  :root {
    color-scheme: light dark;
    --navy: #1F3864;
    --fg: #1a1c20;
    --muted: #55606e;
    --line: #d7dde5;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --navy: #9db8e8; --fg: #e8eaed; --muted: #a4adba; --line: #2c313a; --bg: #14161a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 48rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { color: var(--navy); font-size: 1.6rem; line-height: 1.3; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  h2 { color: var(--navy); font-size: 1.15rem; margin: 2rem 0 0.5rem; }
  a { color: var(--navy); }
  .back { display: inline-block; margin-bottom: 1.5rem; font-size: 0.9rem; }
  canvas, img, svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<main class="wrap">

  <a class="back" href="index.html">&larr; All lectures</a>

  <h1>Untitled Lecture</h1>
  <p class="sub">One-line description of what this covers</p>

  <h2>Section</h2>
  <p>Content goes here.</p>

</main>
</body>
</html>
